<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <script>
    // ouvert par un double-clic sur index.html (adresse file://…) : le navigateur y interdit au jeu de lire ses propres images
    // (« getImageData » refusé : personnage invisible à la création, décors cassés) — on part sur le jeu en ligne, le même
    // partout. Pour jouer sur PC : JOUER.bat (voir README.md).
    if (location.protocol === 'file:') location.replace('https://kronos4322.github.io/digimon-ile-des-fichiers/' + location.search + location.hash);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Digimon — L'Aventure de l'Île des Fichiers</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%227%22 fill=%22%23f8a832%22/%3E%3Ccircle cx=%2210%22 cy=%226%22 r=%222%22 fill=%22%232ea040%22/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- application installable (PC : « Installer le jeu », téléphone : « Ajouter à l'écran d'accueil ») -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#08143a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
</head>
<body>
  <canvas id="game"></canvas>
  <!-- (caché d'office : même avec une ancienne feuille de style encore en cache, il n'apparaît que sur l'écran titre) -->
  <button id="installer" type="button" hidden>Installer le jeu</button>

  <!-- tous les scripts du jeu, dans l'ordre : voir js/scripts.js -->
  <script src="js/scripts.js"></script>
  <!-- la page elle-même (à part des scripts du jeu : le service worker s'installe même si un script du jeu échoue) -->
  <script>
    // hors ligne + mises à jour automatiques (sw.js)
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

    // bouton « Installer le jeu », quand le navigateur le permet — seulement sur l'écran titre (en jeu, il couvrait le
    // bouton B du téléphone)
    (function () {
      const btn = document.getElementById('installer');
      let ask = null;
      window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ask = e; });
      window.addEventListener('appinstalled', () => { ask = null; });
      btn.addEventListener('click', async () => { if (!ask) return; ask.prompt(); await ask.userChoice; ask = null; });
      setInterval(() => {
        const on = !!ask && !!DW.TitleScene && DW.Game.top() instanceof DW.TitleScene;
        if ((btn.style.display === 'block') !== on) btn.style.display = on ? 'block' : 'none';
      }, 400);
    })();

    // plein écran : téléphone dès le premier toucher (en paysage), PC avec F11 ou un double-clic sur le jeu
    (function () {
      const full = () => document.fullscreenElement || document.webkitFullscreenElement;
      const go = () => {
        if (full()) return;
        const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req) return;
        Promise.resolve(req.call(el, { navigationUI: 'hide' }))
          .then(() => { try { screen.orientation.lock('landscape').catch(() => {}); } catch (e) { /* pas de verrouillage */ } })
          .catch(() => {});
      };
      window.addEventListener('touchend', go, { passive: true });
      // (pas au toucher : deux touchers rapides dans un dialogue faisaient sortir du plein écran)
      document.getElementById('game').addEventListener('dblclick', () => { if (DW.Touch && DW.Touch.on) return; full() ? document.exitFullscreen() : go(); });
      window.addEventListener('keydown', e => { if (e.code === 'F11') { e.preventDefault(); full() ? document.exitFullscreen() : go(); } });
    })();
  </script>
</body>
</html>
